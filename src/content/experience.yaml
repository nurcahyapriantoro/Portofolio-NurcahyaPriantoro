        Built audit pipelines covering 100% of inter-depot tanker voyages and bunker transfers in
        scope to detect operational losses in real time.
    - title: Thermal Anomaly & Anti-Fraud Detection
      text: >-
        Reconciled shore and ship volumes at loading and discharge; flagged potential manipulation
        of temperature and volume correction factors (VCF).
    - title: Statistical Process Control (Shewhart Triage)
      text: >-
        Used Shewhart control charts and trip benchmarks to distinguish normal transit variation
        from anomalies warranting forensic escalation.
    - title: Real-Time Executive Audit Portal
      text: >-
        Built a FastAPI + Vite portal for senior SPI auditors to monitor loading discrepancies
        against project thresholds (tracking live metrics such as 0.031% R1 variance).
    - title: Enterprise Governance & Asset Protection
      text: >-
        Translated internal audit requirements into maintainable surveillance workflows helping
        investigators prioritize and escalate potential losses.
  tech:
    - Python
    - SQL
    - FastAPI
    - Vite
    - Statistical Process Control
    - API MPMS Ch. 17
    - Digital Forensic Analytics
