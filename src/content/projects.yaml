- id: ikan-beku-chain
  title: Ikan Beku Chain — Frozen Fish Blockchain Governance
  subtitle: Permissioned Supply-Chain Traceability (TKT 5 Prototype)
  client: BRAIN IPB University × Pekalongan City Government
  period: Aug 2026 – Oct 2026
  tier: featured
  status: Prototype
  logo: ../assets/images/logos/ipb.png
  summary: >-
    Four-organization Hyperledger Fabric network (Fishermen, Fish Auction, Cold Storage, DKP)
    enforcing transparent weighing, levy calculation, and immutable SHA-256 audit trails.
  bullets:
    - Go chaincode detecting >5% weighing discrepancies, auctions, 3% levies, and invoices
    - NestJS 10 API with JWT RS256, 5-role RBAC, and Grafana/Prometheus monitoring
    - Validated via a 25-step on-chain end-to-end test suite (159+ on-chain transactions)
  tech: [Hyperledger Fabric, Go Chaincode, NestJS 10, JWT RS256, Grafana, Prometheus]
